server:
  # HTTP port used by the application.
  port: ${SERVER_PORT}

spring:
  application:
    # Application name used in logs and monitoring.
    name: somqr-payment-service
  profiles:
    # Active profile; defaults to dev when not provided.
    active: ${SPRING_PROFILES_ACTIVE:dev}

springdoc:
  api-docs:
    # Enable or disable the OpenAPI JSON endpoint.
    enabled: ${SPRING_DOC_API_DOCS_ENABLED:false}
  swagger-ui:
    # Enable or disable the Swagger UI page.
    enabled: ${SPRING_DOC_SWAGGER_UI_ENABLED:false}

cors:
  # Comma-separated origins allowed to call the API.
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# SOMQR configuration for P2P and P2M QR generation.
somqr:
  p2p:
    # P2P scheme identifier:
    # 01 = Bank, 02 = Telecom/MNO, 03 = Non-bank.
    scheme-identifier: ${SOMQR_P2P_SCHEME_IDENTIFIER}
    # Financial institution name holding the beneficiary account.
    # Maximum 35 characters.
    fi-name: ${SOMQR_P2P_FI_NAME}
  p2m:
    # Fixed provider identifiers used when generating P2M merchant QR codes.
    fi:
      # Four-digit bank acquirer ID assigned by Central Bank of Somalia (CBS); encoded under Tag 26/Sub-tag 01.
      acquirer-id: ${SOMQR_P2M_FI_ACQUIRER_ID}
    mno:
      # Telecom network identifier:
        # 01 = Hormuud, 02 = Somtel.
      network-id: ${SOMQR_P2M_MNO_NETWORK_ID}